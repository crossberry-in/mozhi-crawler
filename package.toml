# crawler — Mozhi package manifest
[package]
name = "crawler"
version = "1.3.0"
description = "Complete Multi-Agent LLM Research Engine, Web Spider, DOM Tree, CSS Selectors, Persistent Cache, and Link Graph for Mozhi"
license = "MIT"
category = "web"
edition = "2024"

[module]
# File loaded by the interpreter for 'import crawler'
entry = "src/mod.mz"
mod = "Crawler: Multi-Agent LLM Research Engine, Web Spider, DOM Tree, CSS Selectors, Persistent Cache, Link Graph, SSRF Security"

[exports]
