# crawler — Mozhi package manifest
[package]
name = "crawler"
version = "1.2.0"
description = "Production-ready Web Crawler, Spider, DOM Tree, CSS Selectors, Schemas, Storage, and Link Graph for Mozhi"
license = "MIT"
category = "web"
edition = "2024"

[module]
# File loaded by the interpreter for 'import crawler'
entry = "src/mod.mz"
mod = "Crawler: Web Spider, DOM Tree, CSS Selectors, Storage, Link Graph, SSRF Security"

[exports]
spider = "mod.spider"
spider_stats = "mod.spider_stats"
scrape = "mod.scrape"
scrape_with_options = "mod.scrape_with_options"
crawl = "mod.crawl"
crawl_url = "mod.crawl_url"
same_origin = "mod.same_origin"
content_fingerprint = "mod.content_fingerprint"
url_to_cache_key = "mod.url_to_cache_key"
init_storage = "mod.init_storage"
storage_put = "mod.storage_put"
storage_get = "mod.storage_get"
storage_invalidate = "mod.storage_invalidate"
get_outgoing_links = "mod.get_outgoing_links"
get_incoming_links = "mod.get_incoming_links"
find_broken_links = "mod.find_broken_links"
find_redirects = "mod.find_redirects"
find_duplicate_content = "mod.find_duplicate_content"
parse_url = "mod.parse_url"
resolve_url = "mod.resolve_url"
normalize_url = "mod.normalize_url"
normalize_path = "mod.normalize_path"
same_host = "mod.same_host"
get_file_extension = "mod.get_file_extension"
is_image_ext = "mod.is_image_ext"
is_video_ext = "mod.is_video_ext"
is_document_file_ext = "mod.is_document_file_ext"
parse_html = "mod.parse_html"
query_selector = "mod.query_selector"
query_selector_all = "mod.query_selector_all"
matches_selector = "mod.matches_selector"
node_text = "mod.node_text"
node_attr = "mod.node_attr"
node_html = "mod.node_html"
node_inner_html = "mod.node_inner_html"
extract = "mod.extract"
extract_metadata = "mod.extract_metadata"
extract_json_ld = "mod.extract_json_ld"
extract_tables = "mod.extract_tables"
extract_page_data = "mod.extract_page_data"
parse_robots_txt = "mod.parse_robots_txt"
is_robots_allowed = "mod.is_robots_allowed"
parse_sitemap = "mod.parse_sitemap"
is_private_ip = "mod.is_private_ip"
validate_target_url = "mod.validate_target_url"
print_tables = "mod.print_tables"
print_page_tables = "mod.print_page_tables"
export_json = "mod.export_json"
export_jsonl = "mod.export_jsonl"
export_csv = "mod.export_csv"
